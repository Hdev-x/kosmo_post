plugins {
	id 'eclipse'
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gguek'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// JSP 연동을 위한 의존성 추가
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper' // JSP를 렌더링하기 위한 Tomcat Jasper 엔진
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api' // JSTL API (Jakarta EE 9 이상)
    runtimeOnly 'org.glassfish.web:jakarta.servlet.jsp.jstl' // JSTL 구현체 (Jakarta EE 9 이상)
    // JSTL 연동을 위한 최적화된 의존성 (Jakarta EE 10 대응)
	//implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
	//implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
}

 eclipse {
    wtp {
        facet {
            facet name: 'jst.web', version: '6.0' // 또는 사용하려는 Dynamic Web Module 버전
            facet name: 'jst.java', version: '21' // 사용 중인 Java 버전
        }
    }
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
    main {
        resources {
            // 1. 기존 리소스 폴더는 그대로 다 가져온다 (properties 포함)
            srcDirs = ['src/main/resources', 'src/main/java']
            
            // 2. java 폴더에서는 xml만 가져오도록 패턴을 분리하거나
            // 아래처럼 전체를 허용하되 특정 확장자만 필터링되지 않게 주의해야 함
            include '**/*' 
        }
    }
}